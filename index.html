<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OET 週次トラッカー</title>
<meta name="theme-color" content="#0f172a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="OET">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='40' fill='%230f172a'/%3E%3Ctext x='90' y='118' font-size='90' text-anchor='middle' fill='%2338bdf8' font-family='sans-serif' font-weight='bold'%3EOET%3C/text%3E%3C/svg%3E">
<link rel="manifest" href="data:application/json,%7B%22name%22%3A%22OET%20Weekly%22%2C%22short_name%22%3A%22OET%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%230f172a%22%2C%22theme_color%22%3A%22%230f172a%22%7D">
<style>
  :root{
    --bg:#0f172a; --card:#1e293b; --card2:#273548; --line:#334155;
    --txt:#e2e8f0; --dim:#94a3b8; --faint:#64748b;
    --L:#38bdf8; --R:#a78bfa; --S:#fb923c; --W:#34d399;
    --ok:#22c55e; --warn:#f59e0b; --bad:#ef4444;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--bg);color:var(--txt);
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Segoe UI",sans-serif;
    padding:env(safe-area-inset-top) 0 calc(env(safe-area-inset-bottom) + 80px);}
  header{position:sticky;top:0;z-index:10;background:rgba(15,23,42,.92);
    backdrop-filter:blur(8px);padding:14px 16px 8px;border-bottom:1px solid var(--line)}
  h1{font-size:17px;margin:0 0 2px;display:flex;align-items:center;gap:8px}
  .wknav{display:flex;align-items:center;justify-content:space-between;margin-top:6px;font-size:13px;color:var(--dim)}
  .wknav button{background:var(--card2);border:1px solid var(--line);color:var(--txt);
    width:34px;height:30px;border-radius:8px;font-size:15px}
  .wknav .range{font-weight:600;color:var(--txt)}
  .tabs{display:flex;gap:6px;margin-top:10px}
  .tabs button{flex:1;background:transparent;border:none;color:var(--dim);
    padding:8px 0;font-size:14px;font-weight:600;border-radius:8px}
  .tabs button.on{background:var(--card2);color:var(--txt)}
  main{padding:14px 16px;max-width:560px;margin:0 auto}
  .ring{display:flex;align-items:center;gap:14px;background:var(--card);
    border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px}
  .ring svg{flex:none}
  .ring .info{font-size:13px;color:var(--dim)}
  .ring .info b{font-size:15px;color:var(--txt)}
  .carry{background:#3b1d1d;border:1px solid #7f1d1d;border-radius:14px;padding:12px 14px;margin-bottom:14px}
  .carry h3{margin:0 0 6px;font-size:13px;color:#fca5a5}
  .carry .ci{display:flex;align-items:center;gap:10px;padding:6px 0;font-size:13px;color:#fecaca}
  .carry .ci .tag{font-size:10px;padding:1px 6px;border-radius:5px;background:#7f1d1d}
  .carry .ci .box{margin-left:auto;width:24px;height:24px;border:1.5px solid #fca5a5;border-radius:6px;flex:none}
  .grp{margin-bottom:16px}
  .ghead{display:flex;align-items:center;gap:8px;margin:0 0 8px;font-size:13px;font-weight:700;letter-spacing:.04em}
  .dot{width:10px;height:10px;border-radius:3px}
  .row{display:flex;align-items:flex-start;gap:12px;background:var(--card);
    border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:8px;transition:.12s}
  .row.today{border-color:var(--L)}
  .row.done{opacity:.55}
  .row.overdue{border-color:#7f1d1d}
  .row.pre{opacity:.4}
  .row.pre .box{border-style:dashed}
  .pretag{color:var(--faint);font-weight:700}
  .todayhd{font-size:15px;font-weight:800;color:var(--L);margin:2px 0 10px;display:flex;align-items:center;gap:6px}
  .todaynone{font-size:13px;color:var(--dim);background:var(--card);border:1px dashed var(--line);border-radius:12px;padding:16px;margin-bottom:8px;text-align:center}
  .weekhd{font-size:13px;font-weight:800;color:var(--dim);letter-spacing:.04em;
    margin:22px 0 12px;padding-top:16px;border-top:1px solid var(--line)}
  .box{width:26px;height:26px;border:2px solid var(--faint);border-radius:8px;flex:none;
    display:flex;align-items:center;justify-content:center;font-size:16px;color:transparent;margin-top:1px}
  .row.done .box{background:var(--ok);border-color:var(--ok);color:#0f172a}
  .meta{flex:1;min-width:0}
  .meta .day{font-size:11px;color:var(--dim);font-weight:700;margin-bottom:2px}
  .meta .day .now{color:var(--L)}
  .meta .lab{font-size:14px;line-height:1.4}
  .row.done .meta .lab{text-decoration:line-through;text-decoration-color:var(--faint)}
  .meta .note{font-size:11px;color:var(--faint);margin-top:4px;line-height:1.4}
  .sphd{font-size:12px;font-weight:700;color:var(--warn);margin:-4px 0 10px}
  .spday{font-size:10px;color:var(--warn);font-weight:700}
  .gate{background:#0c2a3a;border:1px solid #0e4a63;border-radius:14px;padding:12px 14px;margin-bottom:14px}
  .gate .gt{font-size:13px;font-weight:700;color:var(--L)}
  .gate .gl{font-size:13px;margin-top:4px}
  .gate .gs{font-size:11px;color:var(--faint);margin-top:4px}
  .lg{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);font-size:12px;color:var(--dim)}
  .lg .sugg{margin-bottom:8px}.lg .sugg b{color:var(--L);font-size:14px}.lg .sugg span{color:var(--faint)}
  .lgrow{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px}
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
  .seg button{background:transparent;border:none;color:var(--dim);padding:6px 10px;font-size:13px}
  .seg button+button{border-left:1px solid var(--line)}
  .seg button.sug{color:var(--L)}
  .seg button.on{background:var(--L);color:#0f172a;font-weight:700}
  .lg input{width:52px;background:var(--card2);border:1px solid var(--line);color:var(--txt);
    border-radius:8px;padding:6px;font-size:16px;text-align:center}
  .drow{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);
    border-radius:12px;padding:8px 10px 8px 12px;margin-bottom:6px;font-size:13px}
  .drow.today{border-color:var(--L)}.drow.overdue{border-color:#7f1d1d}.drow.pre{opacity:.4}
  .drow .dl{font-weight:700;color:var(--dim);min-width:58px}.drow .now{color:var(--L);margin-right:3px}
  .drow .res{font-size:11px;color:var(--faint)}
  .chips{margin-left:auto;display:flex;gap:6px}
  .chip{min-width:40px;height:32px;padding:0 8px;border:1.5px solid var(--faint);border-radius:8px;display:flex;
    align-items:center;justify-content:center;font-size:14px;color:var(--dim);cursor:pointer}
  .chip.on{background:var(--ok);border-color:var(--ok);color:#0f172a;font-weight:700}
  details.other{margin-top:22px;border-top:1px solid var(--line);padding-top:14px}
  details.other summary{font-size:13px;font-weight:800;color:var(--dim);cursor:pointer;margin-bottom:12px;list-style-position:inside}
  .empty{color:var(--faint);font-size:13px;text-align:center;padding:24px 0}
  /* stats */
  .stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
  .stat h3{margin:0 0 12px;font-size:13px;color:var(--dim);font-weight:600}
  .streak{display:flex;align-items:baseline;gap:8px}
  .streak .big{font-size:46px;font-weight:800;color:var(--L);line-height:1}
  .streak .u{font-size:14px;color:var(--dim)}
  .streak .max{margin-left:auto;font-size:12px;color:var(--faint);text-align:right}
  .heat{display:grid;grid-template-rows:repeat(7,1fr);grid-auto-flow:column;gap:3px;overflow-x:auto;padding-bottom:4px}
  .cell{width:13px;height:13px;border-radius:3px;background:var(--card2)}
  .bars{display:flex;align-items:flex-end;gap:6px;height:90px}
  .bar{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px}
  .bar .fill{width:100%;background:var(--L);border-radius:4px 4px 0 0;min-height:2px;opacity:.85}
  .bar .wl{font-size:9px;color:var(--faint)}
  .tw{position:relative}
  .tbars{display:flex;gap:6px;padding-top:16px}
  .tb{flex:1;display:flex;flex-direction:column;align-items:center}
  .tb .plot{height:90px;width:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center}
  .tb .fill{width:100%;border-radius:4px 4px 0 0;opacity:.85}
  .tb .bv{font-size:10px;color:var(--dim);margin-bottom:2px}
  .tb .wl{height:16px;line-height:16px;font-size:9px;color:var(--faint)}
  .goal{position:absolute;left:0;right:0;border-top:1.5px dashed var(--L);opacity:.7;pointer-events:none}
  .goal span{position:absolute;right:0;top:-14px;font-size:9px;color:var(--L)}
  .counts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .cnt{background:var(--card2);border-radius:10px;padding:12px}
  .cnt .n{font-size:24px;font-weight:800}
  .cnt .l{font-size:11px;color:var(--dim);margin-top:2px}
  .legend{display:flex;gap:6px;align-items:center;font-size:10px;color:var(--faint);margin-top:8px;justify-content:flex-end}
  .legend .cell{width:11px;height:11px}
</style>
</head>
<body>
<header>
  <h1>📋 OET 週次トラッカー</h1>
  <div class="wknav">
    <button id="prev">‹</button>
    <span class="range" id="range"></span>
    <button id="next">›</button>
  </div>
  <div class="tabs">
    <button id="t-week" class="on">今週</button>
    <button id="t-stats">積み重ね</button>
  </div>
</header>
<main id="app"></main>

<script>
"use strict";
const KEY="oet-weekly-v2";
const START="2026-06-21";   // プログラム開始日。これより前は「開始前」扱い（計上しない）
const CARRY_FROM="2026-10-04"; // リセット日。これより前に始まった週のやり残しは繰り越さない（10/7再始動）
const SESS={
  L:{name:"Listening",color:"var(--L)"},
  R:{name:"Reading",color:"var(--R)"},
  S:{name:"Speaking",color:"var(--S)"},
  W:{name:"Writing",color:"var(--W)"},
  X:{name:"記録",color:"var(--dim)"},
};
// 0=Sun .. 6=Sat（週の始まりは日曜）
const DAYJP=["日","月","火","水","木","金","土"];
// task templates
// Listening 月〜土：3工程を別々にチェック。①が「その日やった」の判定（連続記録もこれ）
const L_STEPS=[
  {id:"L-1",short:"①",lab:"止めない再解答：採点済みPart A 1本を一時停止なしで書き切る",
   note:"空欄禁止・綴りは頭3〜4文字でOK。終わったら速度と無回答数を下に記録。忙しい日もこれ10分だけは切らさない"},
  {id:"L-2",short:"②",lab:"①で書けなかった箇所だけ止めてディクテ",
   note:"2語の答えは前置詞・後ろの名詞まで（at rest／after Christmas／second toe）"},
  {id:"L-3",short:"③",lab:"綴り・複数形・冠詞を照合 → エラーログに記入",
   note:"Obsidian「OET Listening エラーログ」の今日のブロックへ"},
];
const SPEEDS=["1.0","1.1","1.15"];
const GOAL={a:18,bl:2};   // 途中目標：初見Part A 18/24以上・無回答2以下（2026-10-07判断）
const WEEK_TASKS=[
  {id:"L-sun",sess:"L",day:0,lab:"初見Part A（余力でB/C）を等速・止めずに解く → 採点",
   note:"Jahshan冊子の未使用セット。点数と無回答数を下に記録。🔁 解いた音源は今週の①素材へ回す"},
  {id:"L-shadow",sess:"L",day:null,from:"2026-10-11",lab:"今週の失点区間をシャドーイング 15分（スクリプト無し）",
   note:"等速で書けなかった区間（例: E2L I A2「inflamed. But it never goes to the big toe」）"},
  {id:"L-bc",sess:"L",day:null,from:"2026-10-11",lab:"Part B または C を1本（維持枠）",
   note:"B/Cは武器。週1本で落とさない程度に"},
  // from: そのタスクを追加した週の日曜。それより前の週には出さず、繰り越しもしない
  // Reading（2026-10-14〜）：B/Cは通勤ドリルアプリで毎日数問。模試1回分を月〜木に分けて解き、土に採点
  {id:"R-mockA",from:"2026-10-11",sess:"R",day:1,lab:"模試 Part A（20問・15分通し）",
   note:"素材は通勤ドリルと重ならないもの：SOLO Official01→02→03 → NEW OET Sample12。開始・終了時刻をメモ、空欄は ×（不明）/T（時間切れ）"},
  {id:"R-mockB",from:"2026-10-11",sess:"R",day:2,lab:"模試 Part B（6問）"},
  {id:"R-mockC1",from:"2026-10-11",sess:"R",day:3,lab:"模試 Part C Text 1（8問・約22分）"},
  {id:"R-mockC2",from:"2026-10-11",sess:"R",day:4,lab:"模試 Part C Text 2（8問・約22分）",note:"金は予備日（溢れた分をここで）"},
  {id:"R-grade",from:"2026-10-11",sess:"R",day:6,lab:"模試をClaudeに採点に出す → 誤答ノート"},
  {id:"R-app",from:"2026-10-11",sess:"R",day:null,lab:"通勤ドリルでB・Cを数問（毎日）",
   note:"zh1235789-png.github.io/oet-reading-commute/ 。週の終わりに、ほぼ毎日できたらチェック"},
  {id:"S-roleplay",sess:"S",day:null,lab:"ロールプレイ ×1（録音）",note:"今の予定は Card13・Card15 の再録"},
  {id:"S-phrase",from:"2026-10-11",sess:"S",day:null,lab:"フラッシュカードアプリで10分（毎日）",
   note:"締め4パーツ・拒否の初動・汎用語10語を重点に。週の終わりに、ほぼ毎日できたらチェック"},
  {id:"W-write",sess:"W",day:null,lab:"本番 referral letter を1通書いて提出"},
  {id:"W-grade",sess:"W",day:null,lab:"Claude添削／採点を反映"},
];
// 特別期間：日付ごとの差し替えメニュー。この日は通常のLコア・曜日固定タスクを出さない（任意のS/Wは残す）
const SPECIAL={
  "2026-09-18":{title:"🍁 シルバーウィーク準備日・約1時間",tasks:[
    {id:"L-prep",sess:"L",lab:"素材準備：Jahshan PDFの問題ページだけ書き出す",
     note:"英語学習/OET/matarials/Listening Jahshan OET Collection。問題の直後に解答があるので問題ページだけ印刷。ST2 p51／E2L I p117／ST3 p286"},
    {id:"L-dict",sess:"L",lab:"ディクテーション 20分"},
    {id:"S-prep",sess:"S",lab:"Card05（帯状疱疹）のキーワードと締め4パーツを紙に書く"},
  ]},
  "2026-09-19":{title:"🍁 シルバーウィーク・約5時間",tasks:[
    {id:"L-mock1",sess:"L",lab:"初見フル模試①：Sample Test 2 ＋ 転記照合1パス",
     note:"音源 Audio/4- Sample Test 2（A13分/B9分/C18分）。問題 p51／解答 p61。綴り・複数-s・単位・桁を照合"},
    {id:"L-rev1",sess:"L",lab:"模試①の復習：失点箇所をディクテ → エラーログに分類",
     note:"「ディクテでは書けたのに解答で落とした」件数を数える"},
    {id:"W-write5",sess:"W",lab:"W5 本番40分：Sample Test 1 の Writing ケース",
     note:"冒頭 I am writing to refer／本文3段落／過去時制で統一"},
    {id:"W-grade5",sess:"W",lab:"W5 を Claude 添削に出す"},
    {id:"S-rec05",sess:"S",lab:"Card05 を2本録音（締め4パーツ）",
     note:"要約 → 行動 → safety net → 最終質問"},
  ]},
  "2026-09-20":{title:"🍁 シルバーウィーク・2時間",tasks:[
    {id:"R-c1",sess:"R",lab:"Part C 1テキスト：解く13分 → 構造復旧7分 → 誤答の言語化10分"},
    {id:"L-shadow",sess:"L",lab:"模試①の失点トラックをスクリプト無しでシャドーイング 30分"},
    {id:"S-empathy",sess:"S",lab:"共感の型：死別／怒り／恐怖の3場面を声に出す 20分",
     note:"感情の開示に検査値・統計・機序で返さない"},
    {id:"W-rewrite5",sess:"W",lab:"W5 を添削反映で書き直し＋骨格フレーズ20へ追記 30分"},
  ]},
  "2026-09-21":{title:"🍁 シルバーウィーク・約5時間",tasks:[
    {id:"R-full",sess:"R",lab:"Reading フル通し（A 15分 → B+C 45分）所要時間をメモ",
     note:"SOLO Official01〜03 の最も古いもの。既出なのでスコアは割り引いて見る"},
    {id:"R-rev",sess:"R",lab:"復習：B/C の誤答に理由タグ、マッチングは根拠の段落を書き出す"},
    {id:"L-partA",sess:"L",lab:"初見 Part A だけ：E2Language Test I ＋ 転記照合",
     note:"音源 Audio/10- E2Language Test I。問題 p117／解答 p126。目安 20/24"},
    {id:"S-recST1",sess:"S",lab:"Sample Test 1 の Speaking カード2枚を録音（初見）",
     note:"Card05と合わせて締め4パーツの連続本数を数える。録音は 英語学習/OET/Speaking/録音/ へ"},
  ]},
  "2026-09-22":{title:"🍁 シルバーウィーク・約5時間",tasks:[
    {id:"L-mock2",sess:"L",lab:"初見フル模試②：Sample Test 3 ＋ 転記照合",
     note:"音源 Audio/26- Sample Test 3（A11分/B9分/C17分）。問題 p286／解答 p296"},
    {id:"L-rev2",sess:"L",lab:"模試②の復習：①と失点の型が同じか比べる"},
    {id:"W-write6",sess:"W",lab:"W6 本番40分",
     note:"SOLO Medicine05以降は書く前に docx で既出確認。W5と連続で事故なし・Language 5/7以上ならゲート3クリア"},
    {id:"W-grade6",sess:"W",lab:"W6 を Claude 添削に出す"},
    {id:"S-rec21",sess:"S",lab:"Card21 か Card22 を再録音（共感の型が出るか）"},
  ]},
  "2026-09-23":{title:"🍁 シルバーウィーク・2時間（まとめ）",tasks:[
    {id:"R-b",sess:"R",lab:"Part B 6問"},
    {id:"L-dict2",sess:"L",lab:"模試②の失点トラックをディクテーション 30分"},
    {id:"S-rec",sess:"S",lab:"1本録音（締め4パーツの連続記録を伸ばす）"},
    {id:"X-log",sess:"X",lab:"結果を記録：スプレッドシート／各プランの進捗ログ／Obsidianの連休ノート"},
  ]},
};
const spKey=(d,id)=>"d:"+dkey(d)+":"+id;
const isSpecial=d=>!!SPECIAL[dkey(d)];
// その日のLが済んだか（特別日はLタスクのどれか1つでOK）
function lDayDone(d){
  const sp=SPECIAL[dkey(d)];
  if(sp) return sp.tasks.some(t=>t.sess==="L"&&isDone(spKey(d,t.id)));
  return isDone(stepKey(d,"L-1"))||isDone(dailyKey(d));   // L-core は10/14以前の1チェック方式
}
const stepKey=(d,id)=>"d:"+dkey(d)+":"+id;
const stepDone=(d,id)=>isDone(stepKey(d,id))||isDone(dailyKey(d));
// L daily runs Mon..Sat（日曜始まりなので 1..6）
const L_DAYS=[1,2,3,4,5,6];

let state;
try{ state=JSON.parse(localStorage.getItem(KEY)||'{"done":{}}'); }catch(e){ state={done:{}}; }
if(!state||typeof state!=="object") state={done:{}};
state.done=state.done||{};
state.log=state.log||{};   // 日付 → {sp:"1.0", bl:無回答数}（月〜土） / {a:点数, bl:無回答数}（日曜の初見）
let viewOffset=0;   // weeks from current
let tab="week";

const save=()=>localStorage.setItem(KEY,JSON.stringify(state));
function pad(n){return String(n).padStart(2,"0");}
function dkey(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());}
function weekStart(offset){
  const n=new Date(); n.setHours(0,0,0,0);
  n.setDate(n.getDate()-n.getDay()+offset*7);   // 日曜始まり
  return n;
}
function weekDates(offset){
  const m=weekStart(offset); const a=[];
  for(let i=0;i<7;i++){const d=new Date(m);d.setDate(m.getDate()+i);a.push(d);}
  return a;
}
const wkKey=offset=>"w:"+dkey(weekStart(offset));
const dailyKey=(d)=>"d:"+dkey(d)+":L-core";
const taskKey=(offset,id)=>wkKey(offset)+":"+id;
const isDone=k=>!!state.done[k];
function toggle(k){ if(state.done[k]) delete state.done[k]; else state.done[k]=true; save(); render(); }
function setLog(ds,field,val){
  const e=state.log[ds]||{};
  if(val===""||val===null||val===undefined) delete e[field];
  else e[field]=field==="sp"?String(val):Math.max(0,Math.min(24,parseInt(val,10)||0));
  if(Object.keys(e).length) state.log[ds]=e; else delete state.log[ds];
  save(); render();
}
// 次の止めない再解答の速度：直近の記録で無回答0なら1段上げる、それ以外は据え置き
function nextSpeed(beforeDs){
  const ds=Object.keys(state.log).filter(k=>(!beforeDs||k<beforeDs)&&state.log[k].sp&&state.log[k].bl!==undefined).sort().pop();
  if(!ds) return {sp:"1.0",why:"まず1.0倍で無回答0を目指す"};
  const e=state.log[ds], i=SPEEDS.indexOf(e.sp);
  const md=ds.slice(5).replace("-","/");
  if(e.bl===0&&i<SPEEDS.length-1) return {sp:SPEEDS[i+1],why:`前回 ${md} ${e.sp}倍で無回答0 → 上げる`};
  if(e.bl===0) return {sp:e.sp,why:`前回 ${md} ${e.sp}倍で無回答0。初見素材に切り替えてもよい`};
  return {sp:e.sp,why:`前回 ${md} ${e.sp}倍で無回答${e.bl} → 同じ速度で無回答0まで`};
}

function todayInfo(){
  const t=new Date(); t.setHours(0,0,0,0);
  return {date:t,key:dkey(t),wd:t.getDay()};
}
// 開始日を考慮した週の集計（開始前の日/タスクは計上しない）
// 第2引数 "L" で Listening だけ、"other" で R/S/W/X だけ
function weekStats(offset,only){
  const dates=weekDates(offset); let total=0,done=0;
  const want=s=>!only||(only==="L"?s==="L":s!=="L");
  // 10/14以前の週は L が1日1チェックだったので、その週は1日=1件で数える
  const oneCheck=dkey(dates[0])<"2026-10-11";
  if(want("L")) L_DAYS.forEach(di=>{ const d=dates[di]; if(dkey(d)<START||isSpecial(d)) return;
    if(oneCheck){ total++; if(lDayDone(d)) done++; }
    else L_STEPS.forEach(s=>{ total++; if(stepDone(d,s.id)) done++; }); });
  dates.forEach(d=>{ const sp=SPECIAL[dkey(d)]; if(sp) sp.tasks.forEach(t=>{ if(!want(t.sess)) return; total++; if(isDone(spKey(d,t.id))) done++; }); });
  WEEK_TASKS.forEach(t=>{
    if(!want(t.sess)) return;
    if(t.from&&dkey(dates[0])<t.from) return;   // 追加前の週には出さない
    if(t.day!==null){ if(dkey(dates[t.day])<START||isSpecial(dates[t.day])) return; }
    else { if(dkey(dates[6])<START) return; }   // 任意タスクは週末で判定
    total++; if(isDone(taskKey(offset,t.id))) done++;
  });
  return {total,done};
}

/* ---------- WEEK VIEW ---------- */
const md=d=>`${d.getMonth()+1}/${d.getDate()}`;
function weekView(){
  const dates=weekDates(viewOffset);
  const TI=todayInfo();
  const m=dates[0], su=dates[6];
  document.getElementById("range").textContent=
    `${md(m)}(日) – ${md(su)}(土)`+
    (viewOffset===0?"  今週":viewOffset<0?`  ${viewOffset}週`:`  +${viewOffset}週`);

  const oneCheck=dkey(dates[0])<"2026-10-11";   // 旧方式（Lは1日1チェック）の週
  const buildTask=t=>{
    const k=taskKey(viewOffset,t.id), dd=t.day!==null?dates[t.day]:null;
    const pre=t.day!==null?dkey(dd)<START:dkey(dates[6])<START;
    const isToday=(viewOffset===0&&t.day===TI.wd);
    let extra="";
    if(t.id==="L-sun"&&!pre) extra=sunLogHTML(dkey(dd));
    return {key:k, pre, html:taskRow({key:k,done:isDone(k),pre,
      dayLabel:t.day!==null?DAYJP[t.day]:"今週中", dayDate:dd?md(dd):"",
      isToday, overdue:(!pre&&dd&&dd<TI.date&&!isDone(k)), lab:t.lab, note:t.note||"", extra})};
  };
  const buildSp=(di,t)=>{
    const d=dates[di], k=spKey(d,t.id);
    const isToday=(viewOffset===0&&di===TI.wd);
    return {key:k, pre:false, html:taskRow({key:k,done:isDone(k),pre:false,
      dayLabel:DAYJP[di], dayDate:md(d), isToday, sp:true,
      overdue:(d<TI.date&&!isDone(k)), lab:t.lab, note:t.note||""})};
  };
  const visible=t=>!(t.from&&dkey(dates[0])<t.from)&&!(t.day!==null&&SPECIAL[dkey(dates[t.day])]);
  const spOf=di=>SPECIAL[dkey(dates[di])];

  const wl=weekStats(viewOffset,"L"), wo=weekStats(viewOffset,"other");
  let h=ringHTML(wl,wo);
  h+=gateHTML();
  h+=carryHTML();

  // ① 今日（現在週のみ）：Listening を先頭に、手順どおり縦に並べる
  if(viewOffset===0){
    const td=dates[TI.wd], tsp=spOf(TI.wd);
    h+=`<div class="todayhd">📍 今日 ${DAYJP[TI.wd]} ${md(td)}</div>`;
    let lrows="", orows="";
    if(tsp){
      h+=`<div class="sphd">${tsp.title}</div>`;
      tsp.tasks.forEach(t=>{ const r=buildSp(TI.wd,t).html; if(t.sess==="L") lrows+=r; else orows+=r; });
    } else if(dkey(TI.date)>=START){
      if(L_DAYS.includes(TI.wd)) lrows+=lTodayHTML(td);
      WEEK_TASKS.filter(t=>t.day===TI.wd&&visible(t)).forEach(t=>{ const r=buildTask(t).html; if(t.sess==="L") lrows+=r; else orows+=r; });
    }
    h+= lrows ? `<div class="grp">${ghead("L")}${lrows}</div>`
      : `<div class="todaynone">今日の Listening 必須はありません</div>`;
    if(orows) h+=`<div class="grp">${ghead("other","今日のその他")}${orows}</div>`;
  }

  // ② 今週の Listening
  h+=`<div class="weekhd">🎧 ${viewOffset===0?'今週の':'この週の'} Listening</div>`;
  // 月〜土：1日1行、①②③をチップでチェック
  let days="";
  L_DAYS.forEach(di=>{
    const d=dates[di]; if(spOf(di)) return;
    const pre=dkey(d)<START, isToday=(viewOffset===0&&di===TI.wd);
    const lg=state.log[dkey(d)]||{};
    const chips= oneCheck
      ? `<span class="chip ${isDone(dailyKey(d))?'on':''}" ${pre?'':`onclick="toggle('${dailyKey(d)}')"`}>Lコア</span>`
      : L_STEPS.map(s=>`<span class="chip ${stepDone(d,s.id)?'on':''}" ${pre?'':`onclick="toggle('${stepKey(d,s.id)}')"`}>${s.short}</span>`).join("");
    const res=lg.sp?`<span class="res">${lg.sp}倍・無回答${lg.bl??'?'}</span>`:"";
    const miss=!pre&&d<TI.date&&!lDayDone(d);
    days+=`<div class="drow${isToday?' today':''}${miss?' overdue':''}${pre?' pre':''}">
      <span class="dl">${isToday?'<span class="now">●</span>':''}${DAYJP[di]} ${md(d)}</span>${res}<span class="chips">${chips}</span></div>`;
  });
  for(let di=0;di<7;di++){ const sp=spOf(di); if(sp) sp.tasks.filter(t=>t.sess==="L").forEach(t=>days+=buildSp(di,t).html); }
  h+=`<div class="grp">${days}</div>`;
  let lw="";
  WEEK_TASKS.filter(t=>t.sess==="L"&&visible(t)).forEach(t=>lw+=buildTask(t).html);
  if(lw) h+=`<div class="grp">${lw}</div>`;

  // ③ 維持枠 R/S/W（折りたたみ）
  let other="";
  for(const sk of ["R","S","W","X"]){
    const entries=[];
    WEEK_TASKS.filter(t=>t.sess===sk&&visible(t)).forEach(t=>entries.push({day:t.day===null?99:t.day, r:buildTask(t)}));
    for(let di=0;di<7;di++){ const sp=spOf(di); if(sp) sp.tasks.filter(t=>t.sess===sk).forEach(t=>entries.push({day:di, r:buildSp(di,t)})); }
    entries.sort((a,b)=>a.day-b.day);
    const rows=entries.map(e=>e.r.html).join("");
    if(rows) other+=`<div class="grp">${ghead(sk)}${rows}</div>`;
  }
  if(other) h+=`<details class="other"${otherOpen?' open':''} ontoggle="otherOpen=this.open">
    <summary>📦 維持枠 Reading / Speaking / Writing　${wo.done}/${wo.total}</summary>${other}</details>`;
  return h;
}
let otherOpen=false;
function ghead(sk,label){
  const col=sk==="other"?"var(--dim)":SESS[sk].color;
  return `<div class="ghead"><span class="dot" style="background:${col}"></span>${label||sk+" · "+SESS[sk].name}</div>`;
}
// 今日の L：3工程を縦に、①の下に速度・無回答の記録欄
function lTodayHTML(d){
  const ds=dkey(d), ns=nextSpeed(ds), lg=state.log[ds]||{};
  return L_STEPS.map(s=>{
    const k=stepKey(d,s.id);
    let extra="";
    if(s.id==="L-1"){
      const seg=SPEEDS.map(v=>`<button class="${lg.sp===v?'on':''}${!lg.sp&&v===ns.sp?' sug':''}" onclick="event.stopPropagation();setLog('${ds}','sp','${lg.sp===v?'':v}')">${v}倍</button>`).join("");
      extra=`<div class="lg" onclick="event.stopPropagation()">
        <div class="sugg">今日の速度 <b>${ns.sp}倍</b>　<span>${ns.why}</span></div>
        <div class="lgrow"><span class="seg">${seg}</span>
        <label>無回答 <input type="number" inputmode="numeric" min="0" max="24" value="${lg.bl??''}" placeholder="–"
          onchange="setLog('${ds}','bl',this.value)"> 問</label></div></div>`;
    }
    return taskRow({key:k,done:stepDone(d,s.id),pre:false,dayLabel:s.short,dayDate:"",
      isToday:true,overdue:false,lab:s.lab,note:s.note,extra});
  }).join("");
}
function sunLogHTML(ds){
  const lg=state.log[ds]||{};
  return `<div class="lg" onclick="event.stopPropagation()"><div class="lgrow">
    <label>Part A <input type="number" inputmode="numeric" min="0" max="24" value="${lg.a??''}" placeholder="–"
      onchange="setLog('${ds}','a',this.value)"> /24</label>
    <label>無回答 <input type="number" inputmode="numeric" min="0" max="24" value="${lg.bl??''}" placeholder="–"
      onchange="setLog('${ds}','bl',this.value)"> 問</label></div></div>`;
}
// 途中目標パネル：直近の初見 Part A（日曜の記録）
function gateHTML(){
  const ss=Object.keys(state.log).filter(k=>state.log[k].a!==undefined).sort();
  const last=ss.length?state.log[ss[ss.length-1]]:null;
  const ok=last&&last.a>=GOAL.a&&(last.bl??99)<=GOAL.bl;
  const lastTxt=last?`直近 ${ss[ss.length-1].slice(5).replace("-","/")}：<b>${last.a}/24</b>・無回答 <b>${last.bl??'?'}</b> ${ok?'✅':''}`
    :'日曜の初見 Part A を記録するとここに出ます';
  return `<div class="gate"><div class="gt">🎯 途中目標　初見 Part A ${GOAL.a}/24以上・無回答${GOAL.bl}以下</div>
    <div class="gl">${lastTxt}</div><div class="gs">ゲート判定 2026/12下旬〜2027/1中旬：初見で36/42以上を連続2回</div></div>`;
}
function ringHTML(wl,wo){
  const pct=wl.total?Math.round(wl.done/wl.total*100):0;
  const r=26,c=2*Math.PI*r,off=c*(1-pct/100);
  return `<div class="ring">
    <svg width="64" height="64" viewBox="0 0 64 64">
      <circle cx="32" cy="32" r="${r}" fill="none" stroke="var(--line)" stroke-width="7"/>
      <circle cx="32" cy="32" r="${r}" fill="none" stroke="var(--L)" stroke-width="7"
        stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${off}"
        transform="rotate(-90 32 32)"/>
      <text x="32" y="37" text-anchor="middle" font-size="15" font-weight="800" fill="var(--txt)">${pct}%</text>
    </svg>
    <div class="info"><b>Listening ${wl.done}/${wl.total} 完了</b><br>残り ${wl.total-wl.done} 件　｜　維持枠 ${wo.done}/${wo.total}</div>
  </div>`;
}
function carryHTML(){
  if(viewOffset!==0) return "";
  // last week's incomplete (weekly + dayPinned + sunday), exclude daily L
  const items=[]; const ld=weekDates(-1);
  if(dkey(ld[0])<CARRY_FROM) return "";   // リセット前の週は繰り越さない
  WEEK_TASKS.forEach(t=>{
    const refDay=t.day!==null?dkey(ld[t.day]):dkey(ld[6]);
    if(refDay<START) return;                 // 開始前のタスクは繰り越さない
    if(t.from&&dkey(ld[0])<t.from) return;   // 追加前の週のぶんは繰り越さない
    if(t.day!==null&&isSpecial(ld[t.day])) return;   // 特別メニューで差し替えた日
    const k=taskKey(-1,t.id);
    if(!isDone(k)) items.push({k,sess:t.sess,lab:t.lab});
  });
  ld.forEach(d=>{ const sp=SPECIAL[dkey(d)]; if(sp) sp.tasks.forEach(t=>{
    const k=spKey(d,t.id); if(!isDone(k)) items.push({k,sess:t.sess,lab:`${d.getMonth()+1}/${d.getDate()} ${t.lab}`}); }); });
  if(!items.length) return "";
  let ci=items.map(it=>`<div class="ci" onclick="toggle('${it.k}')">
      <span class="tag" style="color:${SESS[it.sess].color}">${it.sess}</span>
      <span>${it.lab}</span><span class="box"></span></div>`).join("");
  return `<div class="carry"><h3>🔴 先週のやり残し ${items.length}件（タップで消化）</h3>${ci}</div>`;
}
function taskRow(o){
  let cls="row"+(o.done?" done":"")+(o.pre?" pre":"")+(o.isToday&&!o.done&&!o.pre?" today":"")+(o.overdue?" overdue":"");
  const dlabel=`${o.dayLabel}${o.dayDate?" "+o.dayDate:""}${o.sp?' <span class="spday">🍁連休</span>':''}`;
  const badge=o.pre?'<span class="pretag">開始前 </span>':(o.isToday?'<span class="now">● 今日 </span>':'');
  const dayHTML=`<div class="day">${badge}${dlabel}</div>`;
  const click=o.pre?'':`onclick="toggle('${o.key}')"`;
  return `<div class="${cls}" ${click}>
    <div class="box">✓</div>
    <div class="meta">${dayHTML}<div class="lab">${o.lab}</div>${o.note?`<div class="note">${o.note}</div>`:""}${o.extra||""}</div>
  </div>`;
}

/* ---------- STATS VIEW ---------- */
function statsView(){
  // streak (current): walk back from today over Mon..Sat
  const t=new Date(); t.setHours(0,0,0,0);
  let cur=0, d=new Date(t);
  for(let i=0;i<400;i++){
    if(dkey(d)<START) break;                          // 開始前まで遡ったら終了
    const wd=d.getDay();
    if(wd===0){ d.setDate(d.getDate()-1); continue; } // Sunday: skip
    const done=lDayDone(d);
    if(done){ cur++; }
    else if(d<t){ break; } // past & missed -> break (today not-yet-done is forgiven)
    d.setDate(d.getDate()-1);
  }
  // longest streak over recorded daily keys
  const dailyDates=[...new Set([
    ...Object.keys(state.done).filter(k=>k.startsWith("d:")&&/:L-(core|1)$/.test(k)).map(k=>k.slice(2,12)),
    ...Object.keys(SPECIAL).filter(ds=>lDayDone(new Date(ds+"T00:00:00")))
  ])].sort();
  let mx=0,run=0,prev=null;
  dailyDates.forEach(ds=>{
    if(prev){
      const pa=new Date(prev),ca=new Date(ds);
      let gap=Math.round((ca-pa)/86400000);
      // tolerate a single Sunday gap (Sat→Mon)
      if(gap===1||(gap===2&&pa.getDay()===6)) run++;
      else run=1;
    } else run=1;
    mx=Math.max(mx,run); prev=ds;
  });

  let h=`<div class="stat"><h3>🔥 止めない再解答 連続記録（月〜土）</h3>
    <div class="streak"><span class="big">${cur}</span><span class="u">日連続</span>
    <span class="max">最長 ${mx}日<br>総実施 ${dailyDates.length}日</span></div></div>`;

  // heatmap last 12 weeks
  const cells=[];
  const start=weekStart(-11);
  for(let i=0;i<7*12;i++){
    const dt=new Date(start); dt.setDate(start.getDate()+i);
    const wd=dt.getDay();
    let on=false,future=dt>t;
    if(wd===0&&!isSpecial(dt)) on=isDone(taskKey(weekOffsetOf(dt),"L-sun"));
    else on=lDayDone(dt);
    let col= future?"var(--card2)": on?"var(--L)":"var(--card2)";
    let op = on?(wd===0?.55:1):1;
    cells.push(`<div class="cell" style="background:${col};opacity:${op}" title="${dkey(dt)}"></div>`);
  }
  h+=`<div class="stat"><h3>過去12週間の実施（縦=日→土）</h3>
    <div class="heat">${cells.join("")}</div>
    <div class="legend">少 <span class="cell" style="background:var(--card2)"></span>
    <span class="cell" style="background:var(--L);opacity:.55"></span>
    <span class="cell" style="background:var(--L)"></span> 多</div></div>`;

  // weekly completion bars last 8 weeks
  let bars="";
  for(let w=-7;w<=0;w++){
    const ws=weekStats(w);
    const p=ws.total?Math.round(ws.done/ws.total*100):0;
    bars+=`<div class="bar"><div class="fill" style="height:${p}%"></div>
      <div class="wl">${w===0?'今':w}</div></div>`;
  }
  h+=`<div class="stat"><h3>週次達成率（直近8週）</h3><div class="bars">${bars}</div></div>`;

  // 初見 Part A の推移（日曜の記録）と、止めない再解答の無回答数の推移
  const trend=(keys,val,max,goal,goalLbl,good,col)=>{
    if(!keys.length) return '<div class="empty">まだ記録がありません</div>';
    const b=keys.map(k=>{ const v=val(state.log[k]); const p=Math.round(Math.min(v,max)/max*100);
      return `<div class="tb"><div class="plot"><div class="bv">${v}</div><div class="fill" style="height:${Math.max(p,2)}%;background:${good(v)?'var(--ok)':col}"></div></div>
        <div class="wl">${k.slice(5).replace("-","/")}</div></div>`; }).join("");
    return `<div class="tw"><div class="goal" style="bottom:${16+goal/max*90}px"><span>${goalLbl}</span></div><div class="tbars">${b}</div></div>`;
  };
  const aK=Object.keys(state.log).filter(k=>state.log[k].a!==undefined).sort().slice(-8);
  h+=`<div class="stat"><h3>🎯 初見 Part A（日曜・直近8回）</h3>${trend(aK,e=>e.a,24,GOAL.a,"18",v=>v>=GOAL.a,"var(--L)")}</div>`;
  const bK=Object.keys(state.log).filter(k=>state.log[k].sp&&state.log[k].bl!==undefined).sort().slice(-10);
  h+=`<div class="stat"><h3>止めない再解答の無回答数（直近10回・緑=0）</h3>${trend(bK,e=>e.bl,12,GOAL.bl,"2",v=>v===0,"var(--warn)")}
    ${bK.length?`<div class="legend">速度: ${bK.map(k=>state.log[k].sp).join(" → ")}</div>`:""}</div>`;

  // cumulative counts
  const cR=Object.keys(state.done).filter(x=>/:R-/.test(x)).length;
  const cS=Object.keys(state.done).filter(x=>/:S-/.test(x)).length;
  const cQ=Object.keys(state.done).filter(x=>/:L-(sun|mock)/.test(x)).length;
  const cW=Object.keys(state.done).filter(x=>/:W-write/.test(x)).length;
  const c1=Object.keys(state.done).filter(x=>/:L-1$/.test(x)).length;
  const cFast=Object.values(state.log).filter(e=>e.sp&&e.sp!=="1.0").length;
  h+=`<div class="stat"><h3>累計</h3><div class="counts">
    <div class="cnt"><div class="n" style="color:var(--L)">${c1}</div><div class="l">止めない再解答 回数</div></div>
    <div class="cnt"><div class="n" style="color:var(--L)">${cFast}</div><div class="l">うち1.1倍以上</div></div>
    <div class="cnt"><div class="n" style="color:var(--L)">${cQ}</div><div class="l">初見・模試 回数</div></div>
    <div class="cnt"><div class="n" style="color:var(--R)">${cR}</div><div class="l">Reading 演習回</div></div>
    <div class="cnt"><div class="n" style="color:var(--S)">${cS}</div><div class="l">Speaking 実施回</div></div>
    <div class="cnt"><div class="n" style="color:var(--W)">${cW}</div><div class="l">Writing 提出通数</div></div>
  </div></div>`;
  return h;
}
function weekOffsetOf(dt){
  const m0=weekStart(0), md=new Date(dt); md.setHours(0,0,0,0);
  md.setDate(md.getDate()-md.getDay());
  return Math.round((md-m0)/(7*86400000));
}

/* ---------- RENDER / NAV ---------- */
function render(){
  document.getElementById("app").innerHTML = tab==="week"?weekView():statsView();
  document.getElementById("t-week").classList.toggle("on",tab==="week");
  document.getElementById("t-stats").classList.toggle("on",tab==="stats");
  document.querySelector(".wknav").style.visibility = tab==="week"?"visible":"hidden";
}
document.getElementById("prev").onclick=()=>{viewOffset--;render();};
document.getElementById("next").onclick=()=>{viewOffset++;render();};
document.getElementById("t-week").onclick=()=>{tab="week";render();};
document.getElementById("t-stats").onclick=()=>{tab="stats";render();};
render();
</script>
</body>
</html>
